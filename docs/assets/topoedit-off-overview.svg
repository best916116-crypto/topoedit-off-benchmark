<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TopoEdit-Off source-aware benchmark workflow</title>
  <desc id="desc">Public off-target evidence is harmonized by source family, evaluated across mismatch regimes, benchmarked with size-matched ranking, and converted into validation-priority panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#587080"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #142a3a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4f6472; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #dfeaf0; }
      .note { font: 600 13px Arial, sans-serif; fill: #35505f; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="60" y="54" class="title">TopoEdit-Off benchmark workflow</text>
  <text x="60" y="81" class="subtitle">Source-aware evidence stays separated while candidate ranking is compared at matched review cost.</text>

  <g transform="translate(58 125)">
    <rect width="215" height="135" rx="18" fill="#1f4b66"/>
    <text x="24" y="38" class="box-title">Public evidence</text>
    <text x="24" y="68" class="box-text">Conventional nuclease</text>
    <text x="24" y="91" class="box-text">TOPO-seq</text>
    <text x="24" y="114" class="box-text">Base-editor sources</text>
  </g>

  <line x1="285" y1="192" x2="340" y2="192" stroke="#587080" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(350 125)">
    <rect width="215" height="135" rx="18" fill="#246b72"/>
    <text x="24" y="38" class="box-title">Source-aware labels</text>
    <text x="24" y="68" class="box-text">Harmonized identifiers</text>
    <text x="24" y="91" class="box-text">Guide support inventory</text>
    <text x="24" y="114" class="box-text">Mismatch strata</text>
  </g>

  <line x1="577" y1="192" x2="632" y2="192" stroke="#587080" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(642 125)">
    <rect width="215" height="135" rx="18" fill="#4f6a82"/>
    <text x="24" y="38" class="box-title">Ranking benchmark</text>
    <text x="24" y="68" class="box-text">Sequence baselines</text>
    <text x="24" y="91" class="box-text">Size-matched top-K</text>
    <text x="24" y="114" class="box-text">Observed-positive recovery</text>
  </g>

  <line x1="869" y1="192" x2="924" y2="192" stroke="#587080" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(934 125)">
    <rect width="215" height="135" rx="18" fill="#6d526f"/>
    <text x="24" y="38" class="box-title">Review outputs</text>
    <text x="24" y="68" class="box-text">Core / expanded panels</text>
    <text x="24" y="91" class="box-text">Purity audits</text>
    <text x="24" y="114" class="box-text">Validation priorities</text>
  </g>

  <rect x="280" y="292" width="640" height="40" rx="20" fill="#ffffff" stroke="#c6d5dc"/>
  <text x="600" y="317" text-anchor="middle" class="note">Outputs prioritize review and validation; they are not calibrated off-target probabilities.</text>
</svg>
